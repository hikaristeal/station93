<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="theme-color" content="#b3261e">
<meta name="mobile-web-app-capable" content="yes">
<title>Station 93</title>
<script>try{var t=JSON.parse(localStorage.getItem('st93t.theme')||'null');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an apparatus-bay console. Left rail of large touch tabs on a tablet, bottom bar on a phone; work happens in one wide panel, a call opens as a full sheet. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --sunk:#e9ebe7; --fg:#1a1d1b; --muted:#5f6862; --line:#d6dad4;
  --accent:#b3261e; --accent-fg:#ffffff;
  --ok:#1f7a4a; --warn:#a35a00; --bad:#b3261e; --blue:#2d66b0; --gray:#7b847e;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --tap:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--panel:#1b1f1c;--sunk:#232825;--fg:#e7ebe8;--muted:#9aa49d;--line:#323833;--accent:#e2554b;--ok:#46b077;--warn:#e3a23f;--bad:#ef6359;--blue:#6a9be0;--gray:#8d968f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121513;--panel:#1b1f1c;--sunk:#232825;--fg:#e7ebe8;--muted:#9aa49d;--line:#323833;--accent:#e2554b;--ok:#46b077;--warn:#e3a23f;--bad:#ef6359;--blue:#6a9be0;--gray:#8d968f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.rail{overflow-y:auto;min-height:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:12px 8px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.badge{font:700 15px/1 var(--display);letter-spacing:.06em;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:10px 0;text-align:center;margin-bottom:10px}
.tabbtn{min-height:68px;border:0;background:none;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:600 13px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.tabbtn svg{width:26px;height:26px}
.tabbtn.on{background:var(--sunk);color:var(--fg);box-shadow:inset 4px 0 0 var(--accent)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{flex:0 0 auto}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:700 24px/1 var(--display);letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:12px}
.grow{flex:1}
.netdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.netdot i{width:9px;height:9px;border-radius:50%;background:var(--gray)}
.netdot.ok i{background:var(--ok)}.netdot.warn i{background:var(--warn)}.netdot.bad i{background:var(--bad)}
.svc{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);padding:0 16px;font-weight:600}
.svc.in{background:var(--ok);border-color:var(--ok);color:#fff}.svc.out{background:var(--bad);border-color:var(--bad);color:#fff}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-block:16px 24px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:var(--tap);border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:0 18px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.chip{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:0 16px;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{min-height:var(--tap);border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:120px;resize:vertical;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;text-align:left;min-height:84px}
.tile b{display:block;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.hot{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.c-needs{color:var(--warn)}.c-draft,.c-c9{color:var(--blue)}.c-ready{color:var(--ok)}.c-blocked{color:var(--bad)}.c-done{color:var(--gray)}
.list{display:flex;flex-direction:column;gap:8px}
.call{display:grid;grid-template-columns:44px 64px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 10px 0;box-shadow:inset 5px 0 0 var(--bar,var(--line));min-height:68px;text-align:left;width:100%}
.call .pick{display:flex;justify-content:center;align-self:stretch;align-items:center}
.call .pick input{width:24px;height:24px}
.call .num{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.call .num small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.call .what{min-width:0}
.call .what b{display:block;font-weight:600}
.call .what .meta{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call .needs{font-size:13px;color:var(--fg)}
.call .right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:300px}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.age{color:var(--warn);font-weight:600;font-size:12px}
.call.b-needs{--bar:var(--warn)}.call.b-draft,.call.b-c9{--bar:var(--blue)}.call.b-ready{--bar:var(--ok)}.call.b-blocked{--bar:var(--bad)}.call.b-done{--bar:var(--gray)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.bulk{position:sticky;top:0;z-index:5;background:var(--panel);border:1px solid var(--blue);border-radius:var(--r);padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bulk select,.bulk input{width:auto;min-width:170px;flex:1}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet .bar{display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.sheet .bar h2{margin:0;font:700 24px/1 var(--display)}
.sheet .body{flex:1;overflow:auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font:700 15px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sec h3 .grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.locked input,.locked select,input.locked,select.locked{background:var(--sunk);border-style:dashed;color:var(--muted)}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:6px;min-height:36px}
.status{border-left:6px solid var(--bar,var(--line))}
.status.b-needs{--bar:var(--warn)}.status.b-draft,.status.b-c9{--bar:var(--blue)}.status.b-ready{--bar:var(--ok)}.status.b-blocked{--bar:var(--bad)}.status.b-done{--bar:var(--gray)}
/* pickers */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-size:14px}
.cat.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.cat.has:not(.on){border-color:var(--ok);color:var(--ok)}
.panel{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:12px;max-height:360px;overflow:auto}
.ghead{font:700 13px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);padding:0 14px;font-size:14px;text-align:left}
.opt.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sel{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 6px;font-size:13px;background:var(--panel);min-height:40px}
.sel.primary{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.sel button{background:none;border:0;min-width:34px;min-height:34px;font-size:17px;color:var(--muted)}
.sel.primary .star{color:var(--warn)}
.note{color:var(--muted);font-size:13px;margin:0}
.unit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.unit:first-child{border-top:0}
.unitchip{min-height:40px;min-width:76px;border:0;border-radius:8px;background:var(--fg);color:var(--bg);font:700 16px var(--display);letter-spacing:.04em}
.member{min-height:40px;border-radius:999px;border:1px solid var(--ok);background:var(--ok);color:#fff;padding:0 14px}
.unit select{width:auto;min-width:180px}
.hist{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* mileage */
.mtable{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mtable th,.mtable td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
.mtable th{font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mtable td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
/* crew */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 5px 0 0 var(--bar,var(--line))}
.card.in{--bar:var(--ok)}.card.out{--bar:var(--bad)}
.card b{font:700 18px var(--display)}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.seg .on-in{background:var(--ok);border-color:var(--ok);color:#fff}.seg .on-out{background:var(--bad);border-color:var(--bad);color:#fff}
/* dialog + toast */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 24px var(--display)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:var(--tap)}
.radio input{width:22px;height:22px;margin-top:1px}
.preview{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px;font-size:13px;max-height:160px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:60;max-width:90vw}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center}
.notice b{font-weight:600}
/* zone map */
.mapwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(68vh,720px);touch-action:none}
.mapwrap svg{width:100%;height:100%;display:block}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:700}
.mapres{min-height:var(--tap)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bar{display:grid;grid-template-columns:minmax(100px,40%) 1fr 48px;gap:8px;align-items:center;font-size:14px;min-height:30px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .bt{background:var(--sunk);border-radius:4px;height:14px;overflow:hidden}.bar .bt i{display:block;height:100%;background:var(--accent)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px}.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;gap:4px}.cols .col i{display:block;width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}.cols .col span{color:var(--muted)}
/* assessment */
.asgrid{display:flex;flex-wrap:wrap;gap:10px}
.asgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.asgrid .sm{width:130px}.asgrid .md{width:240px}.asgrid .full{width:100%}
.asgrid .chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:15px;min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.asgrid .chk input{width:22px;height:22px}
.private{border-left:5px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
/* lock */
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock h2{margin:0;font:700 30px var(--display)}
.dots{display:flex;gap:14px;min-height:22px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--fg)}.dots i.f{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:12px}
.pad button{height:84px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:600 30px var(--display)}
.lock .err{color:var(--bad);min-height:20px}
/* response mode */
.resp{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.resp .rtop{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--accent);color:#fff}
.resp .rtop h2{margin:0;font:700 22px/1.1 var(--display);flex:1;min-width:0}
.resp .rtop button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600}
.resp .rbody{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.rcall b{display:block;font:700 30px/1.1 var(--display)}.rcall span{font-size:18px;color:var(--muted)}
.rstamps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rstamp{min-height:92px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font:700 22px/1.1 var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rstamp small{font:600 15px var(--body);color:var(--muted)}
.rstamp.set{background:var(--ok);border-color:var(--ok);color:#fff}.rstamp.set small{color:#e6f5ec}
.rstamp.clear{border-color:var(--accent);color:var(--accent)}.rstamp.clear.set{background:var(--accent);color:#fff}
.rnote{display:flex;gap:8px;align-items:stretch}.rnote textarea{min-height:70px;font-size:17px}
.rnote .btn{min-width:84px}
.rlog{margin:0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:3px}
.respbar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent);color:#fff;border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.respbar b{font:700 18px var(--display)}.respbar .grow{flex:1}.respbar button{min-height:44px;border-radius:10px;border:0;padding:0 16px;font-weight:700}
.respbar .go{background:#fff;color:var(--accent)}.respbar .x{background:rgba(255,255,255,.2);color:#fff}
@media (max-width:640px){.rstamp{min-height:80px;font-size:20px}}
/* sign-in (ported from the PC app) */
body.locked>*:not(#gate){visibility:hidden}
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#1e1e20 url(splash.jpg) center/contain no-repeat;color:#fff;transition:background-position .6s ease}
body:not(.locked) .gate{display:none}
.gate.signin{background-position:2vw center;background-size:min(60vw,calc(100vh * 1.75)) auto}
.gate.signin .gatecard{position:absolute;right:max(4vw,16px);top:50%;transform:translateY(-50%);animation:fadein .4s ease both}
@media (max-width:900px),(orientation:portrait){.gate.signin{background-position:center top;background-size:contain}.gate.signin .gatecard{position:static;transform:none;align-self:end;margin-bottom:max(5vh,env(safe-area-inset-bottom,0px))}}
.splash{position:absolute;inset:0;animation:fadein 1s ease both}
.gatecard{width:min(380px,92vw);max-height:92vh;overflow:auto;background:rgba(255,255,255,.97);color:#1b1f24;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fadeup .4s ease both}
.gatecard[hidden],.gatecard [hidden]{display:none!important}
.gatecard h2{margin:0;font:700 26px var(--display)}
.gatebrand{margin:0;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#b3261e;font-weight:700}
.gatecard label{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:13px;color:#5d6672}
.gatecard input{min-height:var(--tap);font-size:17px;background:#fff;color:#1b1f24;border:1px solid #c9ced6;border-radius:var(--r);padding:0 12px;width:100%}
.gatecard .note{color:#5d6672;margin:0}
.gatecard .warn{min-height:1.2em;color:#b3261e;margin:0}
.gatecard .btn.primary{min-height:52px;font-size:17px;background:#b3261e;border-color:#b3261e;color:#fff}
.gatecard .link{color:#2d66b0}
.gatecard .approve{display:flex;flex-direction:column;gap:8px;border-top:1px solid #e1e4e8;padding-top:10px}
.gatecard .approve .note{text-align:left;font-weight:600}
.shake{animation:shake .35s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
@media (prefers-reduced-motion:reduce){.splash,.gatecard,.shake{animation:none}}
.pincard{width:min(360px,92vw)}
.pindots{display:flex;justify-content:center;gap:16px;min-height:22px;margin:4px 0}.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid #1b1f24}.pindots i.f{background:#1b1f24}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pinpad button{height:76px;border-radius:50%;border:1px solid #d6dad4;background:#eef0f2;color:#1b1f24;font:600 28px var(--display)}
.pinpad button:active{background:#d9dde1}.pinpad .blank{visibility:hidden}
.pinlinks{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.btn.update{background:var(--ok);border-color:var(--ok);color:#fff}
.tabbtn.has-update{position:relative}.tabbtn.has-update::after{content:'';position:absolute;top:10px;right:18px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--panel)}
.svc.iconb{width:40px;padding:0;display:inline-grid;place-items:center}.svc.iconb svg{width:20px;height:20px}
.svc.iconb[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.svc.lockb{display:inline-flex;align-items:center;gap:6px}.svc.lockb svg{width:18px;height:18px}
.userlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.userlist li{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line)}
@media (max-width:820px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .call{grid-template-columns:40px 56px 1fr}
  .call .right{grid-column:2/-1;align-items:flex-start;text-align:left;max-width:none}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .main{grid-row:1}
  .rail{grid-row:2;overflow:visible;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 8px calc(14px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .badge{display:none}
  .tabbtn{flex:1;min-height:58px}
  .tabbtn.on{box-shadow:inset 0 3px 0 var(--accent)}
  .top .sub{display:none}
  .top{gap:8px;padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
  .top h1{font-size:20px;white-space:nowrap}
  .netdot{padding:10px;min-width:40px;min-height:40px;justify-content:center}.netdot>span{display:none}
  .svc{padding:0 12px}
  .svc.lockb{width:40px;padding:0;justify-content:center;font-size:0}.svc.lockb svg{width:20px;height:20px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.call,.tile,.opt,.cat{transition:background .12s,border-color .12s}}

<body class="locked">
<div id="gate" class="gate">
  <div id="splash" class="splash" aria-label="Argyle Fire District - Station 93"></div>
  <form id="gateForm" class="gatecard" hidden autocomplete="on">
    <p class="gatebrand">Station 93</p>
    <h2 id="gateTitle">Sign in</h2>
    <p class="note" id="gateHint"></p>
    <label id="gateUserLbl"><span>Username</span><input id="gateUser" type="text" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label id="gatePwLbl"><span>Password or PIN</span><input id="gatePw" type="password" name="password" required></label>
    <label hidden><span>Type the password again</span><input id="gatePw2" type="password" autocomplete="new-password"></label>
    <div class="approve" id="gateApprove" hidden>
      <p class="note">Approved by an existing user</p>
      <label><span>Their username</span><input id="gateAUser" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label><span>Their password or PIN</span><input id="gateAPw" type="password" autocomplete="off"></label>
    </div>
    <p class="warn" id="gateMsg" role="alert"></p>
    <button class="btn primary" id="gateBtn" type="submit">Unlock</button>
    <button class="link" id="gateAlt" type="button">Create new user</button>
  </form>
  <div id="pinCard" class="gatecard pincard" hidden role="dialog" aria-label="Lock screen">
    <p class="gatebrand">Station 93</p>
    <h2 id="pinTitle">Locked</h2>
    <p class="note" id="pinHint"></p>
    <div class="pindots" id="pinDots" aria-hidden="true"></div>
    <p class="warn" id="pinMsg" role="alert"></p>
    <div class="pinpad" id="pinPad"></div>
    <div class="pinlinks"><button class="link" id="pinAlt" type="button">Log out</button><button class="link" id="pinCancel" type="button" hidden>Cancel</button></div>
  </div>
</div>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="badge">AVFD</div>
    <button class="tabbtn on" data-view="calls" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Calls</button>
    <button class="tabbtn" data-view="mileage" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4M12 5V3"/></svg>Mileage</button>
    <button class="tabbtn" data-view="crew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg>Crew</button>
    <button class="tabbtn" data-view="map" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button class="tabbtn" data-view="stats" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
    <button class="tabbtn" data-view="settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Settings</button>
  </nav>
  <div class="main">
    <header class="top">
      <div><h1>Station 93</h1><div class="sub" id="subT">Argyle Fire</div></div>
      <span class="grow"></span>
      <span class="netdot" id="net" title="Connection to the shared store"><i></i><span>Connecting…</span></span>
      <button class="svc" id="svcBtn" type="button">Service</button>
      <button class="svc iconb" id="themeBtn" type="button" aria-pressed="false" aria-label="Dark mode" title="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg></button>
      <button class="svc lockb" id="lockBtn" type="button" title="Lock the app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Lock</button>
    </header>
    <section class="view" id="v-calls"></section>
    <section class="view" id="v-mileage" hidden></section>
    <section class="view" id="v-crew" hidden></section>
    <section class="view" id="v-map" hidden></section>
    <section class="view" id="v-stats" hidden></section>
    <section class="view" id="v-settings" hidden></section>
  </div>
</div>

<script>
(function () {
  'use strict';
  const APPV = '1.8.3';
  // ---------- tiny helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); } kids.flat().forEach((c) => c != null && c !== false && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };
  const nowISO = () => new Date().toISOString();
  const fmtWhen = (s) => { const d = new Date(s); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const fmtDate = (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(s || ''); return m ? `${m[2]}/${m[3]}` : '—'; };
  const units = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3000); };
  const store = {get(k, d) { try { const v = localStorage.getItem('st93t.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('st93t.' + k, JSON.stringify(v)); } catch (e) { /* storage off */ } }};

  const STAGES = ['Needs info', 'Draft staged', 'Awaiting C9', 'Ready to Complete', 'Blocked', "Other's report", 'Completed'];
  const OPEN = STAGES.slice(0, 5);
  const CLS = {'Needs info': 'needs', 'Draft staged': 'draft', 'Awaiting C9': 'c9', 'Ready to Complete': 'ready', 'Blocked': 'blocked', "Other's report": 'done', 'Completed': 'done'};
  let ME = store.get('me', '');
  const meRec = () => Object.values(S.crew).find((c) => c.mine) || Object.values(S.crew).find((c) => c.name === ME) || null;
  const lastName = (n) => String(n || '').trim().split(/\s+/).pop() || '';
  const myNum = () => { const m = meRec(); return m && m.number ? m.number : ''; };
  const myInitials = () => { const m = meRec(); if (!m) return ''; const p = m.name.trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase() + (m.number ? '#' + m.number : ''); };
  const chief = () => (S.crew.C9 || Object.values(S.crew).find((c) => /fire chief/i.test(c.role || '')) || {}).name || '';
  function refreshMe() { const m = meRec(); if (m) { ME = m.name; store.set('me', ME); $('#subT').textContent = `Argyle Fire · ${m.name}${m.number ? ' #' + m.number : ''}`; } }

  // ---------- state: kept on this tablet, synced through Google Drive ----------
  const S = {reports: {}, crew: {}, apparatus: {}, mileage: {}, mileage_archive: {}, ready: false};
  let net = 'wait', view = 'calls';
  (function loadLocal() { const d = store.get('data', null); if (d) { Object.assign(S, d); S.ready = true; } })();
  const persist = () => store.set('data', {reports: S.reports, crew: S.crew, apparatus: S.apparatus, mileage: S.mileage, mileage_archive: S.mileage_archive});
  // Changes for Claude, in the same format the PC app uses. Kept until Claude's reply says it has applied them.
  let outbox = store.get('outbox', []); let dirty = store.get('dirty', false);
  const cfg = Object.assign({client_id: ''}, store.get('cfg', {})); const saveCfg = () => store.set('cfg', cfg);
  const markDirty = () => { dirty = true; store.set('dirty', true); };
  async function put(path, data, merge) {
    const i = path.indexOf('/'); const coll = path.slice(0, i), id = path.slice(i + 1);
    const isTest = coll === 'reports' && ((data && data.test) || (S.reports[id] && S.reports[id].test));
    if (isTest) { const map = S.reports; map[id] = merge && map[id] ? Object.assign(map[id], data) : Object.assign({}, data, {id}); persist(); return true; }   // test calls stay on this tablet
    if (coll === 'requests') outbox.push({at: nowISO(), kind: 'request', id: String(data.report || id), fields: Object.assign({label: data.label || data.action}, data), from: 'tablet'});
    else if (coll === 'servicelog') outbox.push({at: nowISO(), kind: 'servicelog', id, fields: data});
    else {
      const map = S[coll] || (S[coll] = {}); const cur = map[id];
      map[id] = merge && cur ? Object.assign(cur, data) : Object.assign({}, data);
      if (coll === 'mileage' || coll === 'mileage_archive') map[id].vehicle = map[id].vehicle || id.split('-')[0]; else map[id].id = map[id].id || id;
      const kind = coll === 'crew' && 'assigned' in data ? 'crew.assigned' : {reports: 'report.update', crew: 'crew.status', apparatus: 'apparatus.status', mileage: 'mileage.update', mileage_archive: 'mileage.archive'}[coll] || coll + '.update';
      outbox.push({at: nowISO(), kind, id, fields: ['reports', 'mileage', 'mileage_archive'].includes(coll) ? JSON.parse(JSON.stringify(map[id])) : data});
    }
    if (outbox.length > 400) outbox = outbox.slice(-400);
    store.set('outbox', outbox); persist(); markDirty(); setNet(net === 'bad' || net === 'tap' ? net : 'warn'); schedulePush(); return true;
  }
  function setNet(s2, why) {
    net = s2; const n = $('#net'); n.className = 'netdot ' + (s2 === 'ok' ? 'ok' : s2 === 'warn' || s2 === 'tap' ? 'warn' : s2 === 'bad' ? 'bad' : '');
    n.lastChild.textContent = s2 === 'ok' ? 'Synced ' + (cfg.last_sync ? fmtWhen(cfg.last_sync) : '') : s2 === 'warn' ? 'Changes not sent yet' : s2 === 'tap' ? 'Touch the screen to sync' : s2 === 'sync' ? 'Syncing…' : s2 === 'bad' ? (why || 'Offline') : 'Starting…';
    n.title = why || 'Google Drive sync - tap to sync now';
  }

  // ----- Google sign-in (token only, kept on this tablet for up to an hour) -----
  const SCOPES = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file';
  let tok = store.get('tok', null);
  const clientId = () => (cfg.client_id || (window.ST93_CONFIG && window.ST93_CONFIG.clientId) || '').trim();
  const tokenOk = () => tok && tok.exp > Date.now() + 60000;
  function loadGsi() { return new Promise((res) => { if (window.google && google.accounts && google.accounts.oauth2) return res(true); let sc = document.getElementById('gsi'); if (!sc) { sc = el('script', {id: 'gsi', src: 'https://accounts.google.com/gsi/client', async: true}); document.head.append(sc); } sc.addEventListener('load', () => res(true)); sc.addEventListener('error', () => res(false)); setTimeout(() => res(!!(window.google && google.accounts)), 8000); }); }
  // Must be called from a tap: Google opens a small sign-in window.
  // Google ends the sign-in after an hour. Instead of making you find the sync button, the next touch
  // anywhere in the app (a PIN digit, a call, a tab) quietly signs back in to the same account and syncs.
  let autoBusy = false, lastAuto = 0;
  document.addEventListener('pointerdown', () => {
    if (!cfg.connected || !navigator.onLine || autoBusy || syncing) return;
    const soon = !tok || tok.exp < Date.now() + 5 * 60000;          // expired or about to
    if (!soon || Date.now() - lastAuto < 90000) return;
    lastAuto = Date.now(); autoBusy = true;
    signIn(true).then((ok) => { autoBusy = false; if (ok) syncNow(false); });
  }, {capture: true, passive: true});
  async function signIn(quiet) {
    if (!clientId()) { if (!quiet) { toast('Add the Google sign-in ID in Settings first'); show('settings'); } return false; }
    if (!(await loadGsi())) { if (!quiet) toast('Could not reach Google - check the wifi'); return false; }
    return new Promise((res) => {
      const tc = google.accounts.oauth2.initTokenClient({client_id: clientId(), scope: SCOPES, prompt: cfg.connected ? '' : 'consent', hint: cfg.email || undefined,
        callback: (r) => { if (!r || r.error || !r.access_token) { res(false); return; } tok = {t: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000}; store.set('tok', tok); cfg.connected = true; saveCfg(); res(true); },
        error_callback: () => res(false)});
      tc.requestAccessToken();
    });
  }

  // ----- Drive calls -----
  const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';
  async function gd(url, opt) {
    opt = opt || {}; const r = await fetch(url, Object.assign({}, opt, {headers: Object.assign({Authorization: 'Bearer ' + tok.t}, opt.headers || {})}));
    if (r.status === 401) { tok = null; store.set('tok', null); throw Object.assign(new Error('Google sign-in expired'), {code: 'auth'}); }
    if (!r.ok) { const t = await r.text().catch(() => ''); throw Object.assign(new Error(`Drive ${r.status}: ${t.slice(0, 160)}`), {code: r.status}); }
    return r;
  }
  const find = async (q, order) => (await (await gd(`${API}/files?pageSize=20&fields=files(id,name,parents,modifiedTime)&orderBy=${encodeURIComponent(order || 'modifiedTime desc')}&q=${encodeURIComponent(q + ' and trashed=false')}`)).json()).files || [];
  const getJSON = async (id) => (await gd(`${API}/files/${id}?alt=media`)).json();
  async function createFile(meta, body) {
    const bd = 'st93' + Date.now(); const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${meta.mimeType || 'application/json'}\r\n\r\n${body || ''}\r\n--${bd}--`;
    return (await (await gd(`${UP}/files?uploadType=multipart&fields=id`, {method: 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + bd}, body: mp})).json()).id;
  }
  async function findFolders() {
    if (cfg.fromId && cfg.syncId) return;
    const f = await find("name='from-claude' and mimeType='application/vnd.google-apps.folder'");
    if (!f.length) throw new Error("Can't find the Station 93 'from-claude' folder in your Drive");
    cfg.fromId = f[0].id; cfg.syncId = (f[0].parents || [])[0]; saveCfg();
  }

  // ----- merging -----
  const newer = (a, b) => String(a || '') > String(b || '');
  // ----- Android pop-up notifications (shown when a sync brings something new) -----
  const NK = {call: 'New calls', approval: 'Approvals and Ready to Complete', claude: "Claude's work (narratives, OK to Complete results)", other: 'Other updates (stage changes, mileage, notices)'};
  const nset = () => Object.assign({on: false, details: true, call: true, approval: true, claude: true, other: false}, store.get('notify', {}));
  let pops = [];
  function pop(kind, title, body, id) { pops.push({kind, title, body, id}); if (kind === 'call' && id && cfg.notify_armed) { const r = S.reports[id]; respAsk = String(id); } }
  let respAsk = '';
  async function flushPops() {
    const list = pops; pops = []; const ns = nset();
    if (!ns.on || !cfg.notify_armed || !('Notification' in window) || Notification.permission !== 'granted') return;
    const send = list.filter((x) => ns[x.kind]); if (!send.length) return;
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
    const show = (title, body, id, tag) => { const o = {body: ns.details ? body : 'Open Station 93 to see it', icon: 'icon-192.png', badge: 'icon-192.png', tag, renotify: true, data: {id: id || ''}}; const t = ns.details ? title : 'Station 93 update'; try { if (reg) reg.showNotification(t, o); else new Notification(t, o); } catch (e) { /* not allowed here */ } };
    if (send.length > 4) show(`${send.length} Station 93 updates`, send.slice(0, 4).map((x) => x.title).join('\n') + '\n…', '', 'st93-batch');
    else send.forEach((x) => show(x.title, x.body, x.id, x.id ? 'st93-' + x.id + '-' + x.kind : 'st93-' + x.kind + '-' + Date.now()));
  }
  // tapping a pop-up opens that call (after sign-in if the app is locked)
  let pendingOpen = new URLSearchParams(location.search).get('call') || '';
  function openFromPop(id) { if (!id) return; if (document.body.classList.contains('locked')) { pendingOpen = id; return; } if (S.reports[id]) { show('calls'); openCall(id); } }
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.open) openFromPop(String(e.data.open)); });
  function notifySection() {
    const ns = nset(); const can = 'Notification' in window; const perm = can ? Notification.permission : 'unsupported';
    const save = (k, v) => { const o = nset(); o[k] = v; store.set('notify', o); };
    const box = (k, label) => { const c = el('input', {type: 'checkbox', checked: !!ns[k], style: 'width:22px;height:22px'}); c.addEventListener('change', () => save(k, c.checked)); return el('label', {class: 'row', style: 'gap:10px;min-height:44px'}, c, label); };
    const turnOn = async () => { if (!can) { toast('This browser cannot show notifications'); return; } const r = await Notification.requestPermission(); if (r === 'granted') { save('on', true); toast('Pop-ups on'); } else toast('Notifications are blocked - allow them in Android Settings > Apps > Station 93 > Notifications'); renderSettings(); };
    const test = async () => { const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration().catch(() => null) : null; const o = {body: 'This is how Station 93 updates will look.', icon: 'icon-192.png', badge: 'icon-192.png', tag: 'st93-test', data: {id: ''}}; try { if (reg) await reg.showNotification('Station 93 test', o); else new Notification('Station 93 test', o); } catch (e) { toast('Could not show it: ' + e.message); } };

  function installUpdate() {
    confirmBox(`Install Station 93 ${upd.version || 'update'}?`, `The app will restart on the new version (now ${APPV}). Your calls, unsent changes, sign-in and assessment sheets stay on this tablet.`, 'Install now', () => {
      const w = swReg && swReg.waiting; if (!w) { toast('The update is no longer waiting - checking again'); checkUpdate(); return; }
      installing = true; toast('Installing update…'); w.postMessage({type: 'SKIP_WAITING'});
      setTimeout(() => { if (installing) location.reload(); }, 4000);
    });
  }
  function appSection() {
    const btn = upd.ready ? el('button', {type: 'button', class: 'btn update', text: `Update available${upd.version ? ' - ' + upd.version : ''} · Install`, onclick: installUpdate})
      : el('button', {type: 'button', class: 'btn', text: upd.checking ? 'Checking…' : 'Check for update', disabled: upd.checking, onclick: checkUpdate});
    return el('div', {class: 'sec'}, el('h3', {text: 'App'}),
      el('p', {class: 'note', text: upd.ready ? `Version ${APPV} is running. A newer version has downloaded and is ready to install.` : `Version ${APPV}. The app checks for updates when it opens and every 30 minutes; the button turns green when one is ready.`}),
      el('div', {class: 'row'}, btn));
  }

  // ---------- boot ----------
  applyTheme();
  refreshMe();
  show(store.get('view', 'calls'));
  startGate();
  setNet(outbox.length ? 'warn' : 'wait');
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then((reg) => { swReg = reg; watchReg(reg); }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (installing && !reloading) { reloading = true; location.reload(); } });
    setInterval(() => { if (document.visibilityState === 'visible' && swReg && !upd.ready) swReg.update().catch(() => {}); }, 30 * 60000);
  }
  syncNow(false);
  let lastTry = 0; const tick = () => { const gap = document.visibilityState === 'visible' ? 2 * 60000 : 5 * 60000; if (Date.now() - lastTry >= gap) { lastTry = Date.now(); syncNow(false); } };
  setInterval(tick, 30000);
  window.addEventListener('online', () => syncNow(false));
  window.addEventListener('offline', () => setNet(outbox.length ? 'warn' : 'bad', 'Offline - changes are saved on this tablet'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
})();
</script>
</body>
</html>
